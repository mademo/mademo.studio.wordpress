name: WordPress build and release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to publish, for example v2.2.0 (leave empty for artifacts only)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: wordpress-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build WordPress packages
        run: pnpm package:wp

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mademo-wordpress-${{ github.sha }}
          path: releases/*.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" releases/*.zip --clobber
          else
            gh release create "$RELEASE_TAG" releases/*.zip \
              --target "$GITHUB_SHA" \
              --title "Mademo Studio ${RELEASE_TAG#v}" \
              --generate-notes
          fi